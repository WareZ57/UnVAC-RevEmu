// UnVAC (custom plugin: plugins/unvac.sp)
// The server stays VAC secure for everybody: this only decides who gets in despite a VAC ban.

// How VAC-banned players are handled:
//   0 = manual:    only the SteamIDs added with sm_unvac_add "STEAM_0:Y:Z" (RCON or root admin) may join
//   1 = automatic: every VAC-banned account may join, nothing to add
//                  (an account is "VAC-banned" when RevEmu says so in rev-client.log, rev.ini: Logging=True)
// In both modes: the SteamIDs of the list may join, and an admin SteamID is never let in as a VAC-banned
// account. Change it live with: sm_unvac_mode 0   or   sm_unvac_mode 1 (then edit this file to keep it).
sm_unvac_mode "1"
